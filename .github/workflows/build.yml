name: Build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build API
        working-directory: backend
        run: npm install && npm run build
      - name: Build frontend
        working-directory: frontend
        run: npm install && npm run build
